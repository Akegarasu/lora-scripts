name: Release frontend and Windows portable

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to (build source is the selected branch)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      channel: ${{ steps.release.outputs.channel }}
      frontend-version: ${{ steps.release.outputs.frontend-version }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout build source
        uses: actions/checkout@v6
        with:
          # Manual runs build the selected ref's commit at dispatch time.
          # The input tag only selects the Release receiving the artifacts.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Collect release build metadata
        id: release
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from mikazuki.frontend_release import load_release_info

          release = load_release_info()
          tag = os.environ["RELEASE_TAG"]
          # Release naming is independent of the application's build metadata.
          channel = "stable" if re.fullmatch(r"v?\d+\.\d+\.\d+(?:\+[0-9A-Za-z.-]+)?", tag) else "prerelease"
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          print(f"Build source commit: {commit}")
          print(f"Release destination: {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\ncommit={commit}\nchannel={channel}\n")
              output.write(f"frontend-version={release.frontend.version}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"MIKAZUKI_BUILD_COMMIT={commit}\n")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Typecheck and build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Package frontend
        run: python -m mikazuki.scripts.package_frontend_release --output release

      - name: Share frontend release assets
        uses: actions/upload-artifact@v6
        with:
          name: frontend-release
          path: |
            release/frontend-dist.zip
            release/frontend-dist.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build-frontend.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.build-frontend.outputs.channel }}
    steps:
      - name: Download built frontend
        uses: actions/download-artifact@v6
        with:
          name: frontend-release
          path: release

      - name: Publish GitHub Release assets
        working-directory: release
        run: |
          sha256sum --check frontend-dist.zip.sha256
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" frontend-dist.zip frontend-dist.zip.sha256 --clobber
          else
            release_args=(--verify-tag --generate-notes)
            if [[ "$RELEASE_CHANNEL" != "stable" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" frontend-dist.zip frontend-dist.zip.sha256 "${release_args[@]}"
          fi

  publish-jihulab:
    needs: [build-frontend, publish-frontend]
    if: vars.JIHULAB_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built frontend
        uses: actions/download-artifact@v6
        with:
          name: frontend-release
          path: release

      - name: Publish Jihulab generic package
        env:
          JIHULAB_PROJECT_ID: ${{ vars.JIHULAB_PROJECT_ID }}
          JIHULAB_PACKAGE: ${{ vars.JIHULAB_FRONTEND_PACKAGE }}
          JIHULAB_TOKEN: ${{ secrets.JIHULAB_TOKEN }}
          FRONTEND_VERSION: ${{ needs.build-frontend.outputs.frontend-version }}
        working-directory: release
        run: |
          if [[ -z "$JIHULAB_TOKEN" ]]; then
            echo "JIHULAB_TOKEN is not configured; skipping CN package upload."
            exit 0
          fi
          sha256sum --check frontend-dist.zip.sha256
          package="${JIHULAB_PACKAGE:-lora-scripts-frontend}"
          endpoint="https://jihulab.com/api/v4/projects/${JIHULAB_PROJECT_ID}/packages/generic/${package}/${FRONTEND_VERSION}"
          for file in frontend-dist.zip frontend-dist.zip.sha256; do
            curl --fail-with-body --location --retry 3 \
              --header "PRIVATE-TOKEN: ${JIHULAB_TOKEN}" \
              --upload-file "$file" "${endpoint}/${file}"
          done

  release-windows-portable:
    needs: [build-frontend, publish-frontend]
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows-portable.yml
    with:
      tag: ${{ needs.build-frontend.outputs.tag }}
      source-sha: ${{ needs.build-frontend.outputs.commit }}
