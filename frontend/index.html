<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f9" />
    <link rel="icon" type="image/webp" href="/assets/icon.webp" />
    <title>Next Trainer | 训练 UI</title>
    <script>
      const mode = localStorage.getItem("vuepress-color-scheme")
      const systemDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches
      document.documentElement.classList.toggle("dark", mode === "dark" || (mode !== "light" && systemDark))
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
